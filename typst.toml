# for a description of available keys, see https://github.com/typst/packages/?tab=readme-ov-file#package-format

[package]
name = "gat-typst"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["Gatlen Culp <GatlenCulp@gmail.com>"]
license = "MIT"
description = "Gatlen's personal template collection and styles"
homepage = "https://github.com/GatlenCulp/gat-typst"
repository = "https://github.com/GatlenCulp/gat-typst"
keywords = ["Homework"]
categories = ["utility"]
disciplines = ["computer-science", "engineering"]

exclude = [
  ".github",
  "docs",
  "scripts",
  "tests",
  ".typstignore",
  "Justfile",
  "thumbnail-dark.svg",
  "thumbnail-light.svg",
]

[template]
path = "template"
entrypoint = "hw01.typ"
thumbnail = "thumbnail.png"